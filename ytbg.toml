# ytbg の設定 (既定の置き場所は ~/.ytbg/ytbg.toml)
#
# ボードごとに [[board]] を書く。server_id は整数でも文字列でもよい。
# prefix は省略可で、URL のプレフィクス ("/board1" など)。ボードを
# --prefix で起動する。ytbg board は、同じ server_id の [[board]] から
# port と image_dir を取る (CLI で指定すれば CLI が勝つ)。
#
# 置き場所は [path] で変えられる (相対パスは基準からの相対)。
# 基準そのものは --dir か環境変数 YTBG_DIR で変える。
#
#   [path]
#   data = "data"
#   log = "log"
#   images = "images"

[[board]]
server_id = 1
port = 5001
image_dir = "images2"

[[board]]
server_id = 2
port = 5002
image_dir = "images0a"

[[board]]
server_id = 3
port = 5003
image_dir = "images1a"

[[board]]
server_id = 4
port = 5004
image_dir = "images3"
