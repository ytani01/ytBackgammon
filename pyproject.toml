[project]
name = "ytbg"
dynamic = ["version"]
description = "ytBackgammon: network shared backgammon board"
readme = "README.md"
license = "MIT"
authors = [
    { name = "ytani01", email = "yoichi@tanibayashi.jp" }
]
requires-python = ">=3.14"
dependencies = [
    "click>=8.3.1",
    "jinja2>=3.1.6",
    "loguru>=0.7.3",
    "starlette>=0.51.0",
    "uvicorn[standard]>=0.40.0",
]

[project.scripts]
ytbg = "ytbg.__main__:main"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.16.3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ytbg"]
# デザインの元データは配布物に要らない
exclude = ["*.xcf", "*.pptx"]

[tool.hatch.build.targets.sdist]
# docs にはデモ動画 (数十 MB) がある。archives は TODO の記録
exclude = ["/docs", "/archives", "*.xcf", "*.pptx"]

[tool.hatch.version]
# バージョンを git tag に集約する（TODO-014）
source = "vcs"

[tool.hatch.version.raw-options]
# タグ上は 1.0.0、進んだコミットでは 1.0.1.dev3 とし、+g<hash> は付けない
local_scheme = "no-local-version"

[tool.uv]
# editable インストールのキャッシュが tag の変化を検知できるようにする
# （無いとタグを打っても再ビルドされずバージョンが古いまま残る）。
# cache-keys を書くと uv の既定のキー（pyproject.toml の変更）が
# 置き換わって消えるため、file の分も明示して残す
cache-keys = [
    { file = "pyproject.toml" },
    { git = { commit = true, tags = true } },
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# async のテスト関数に marker を書かずに済ませる (TODO-009)
asyncio_mode = "auto"

[tool.ruff]
line-length = 78
# archives/ は決着した項目の記録。ruff format は Markdown 中の python
# ブロックも整形するので、対象から外す。
extend-exclude = ["archives"]

[tool.ruff.lint]
extend-select = ["I", "B", "SIM", "UP", "PTH"]

[tool.mypy]
python_version = "3.14"
check_untyped_defs = true

[[tool.mypy.overrides]]
module = "click"
ignore_missing_imports = true
follow_untyped_imports = true
